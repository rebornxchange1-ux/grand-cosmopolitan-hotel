<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Cosmopolitan Hotel | Dubai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ NAVIGATION ============ -->
<header class="site-header" id="siteHeader">
  <div class="nav-container">

    <button class="nav-toggle" id="navToggle" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="#home" class="nav-logo">Grand Cosmopolitan <span>Hotel</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="#home" class="nav-close" id="navClose" aria-label="Close menu">&times;</a>
      <a href="#home">Home</a>
      <a href="#rooms">Rooms</a>
      <a href="#facilities">Facilities</a>
      <a href="#gallery">Gallery</a>
      <a href="#location">Location</a>
      <a href="#reviews">Reviews</a>
      <a href="#faq">FAQ</a>
      <a href="#contact">Contact</a>
    </nav>

    <a href="#booking" class="btn-nav">Check Availability</a>

  </div>
</header>

<div class="nav-overlay" id="navOverlay"></div>

<!-- ============ SECTIONS PLACEHOLDER ============ -->
<!-- Hero, Booking Form, Hotel Intro, Rooms, Facilities, Gallery,
     Location, Nearby Attractions, Reservation Process, Reviews,
     FAQ, Contact, Footer will be added section by section. -->

<main>

  <!-- ============ HERO ============ -->
  <section id="home" class="hero">

    <div class="hero-video-wrap">
      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline>
        <source src="https://res.cloudinary.com/zznslxmz/video/upload/q_auto,f_auto/v1786178181/3c3256c80615941cb352f25d64c30ac8_c71n5p.mp4" type="video/mp4">
      </video>

      <a href="#hotel-intro" class="hero-scroll-cue" aria-label="Scroll down">
        <span>&darr;</span>
      </a>
    </div>

    <div class="hero-spacer"></div>

    <!-- ============ BOOKING FORM (floating card) ============ -->
    <div class="booking-card-wrap" id="booking">
      <form class="booking-card reveal" id="bookingForm">

        <div class="booking-field">
          <label for="checkIn">Check In</label>
          <input type="date" id="checkIn" name="checkIn" required>
        </div>

        <div class="booking-divider"></div>

        <div class="booking-field">
          <label for="checkOut">Check Out</label>
          <input type="date" id="checkOut" name="checkOut" required>
        </div>

        <div class="booking-divider"></div>

        <div class="booking-field">
          <label for="adults">Adults</label>
          <select id="adults" name="adults">
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
            <option>4</option>
            <option>5+</option>
          </select>
        </div>

        <div class="booking-divider"></div>

        <div class="booking-field">
          <label for="children">Children</label>
          <select id="children" name="children">
            <option selected>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4+</option>
          </select>
        </div>

        <div class="booking-divider"></div>

        <div class="booking-field">
          <label for="roomType">Room Type</label>
          <select id="roomType" name="roomType">
            <option value="Deluxe Room">Deluxe Room</option>
            <option value="Executive Suite">Executive Suite</option>
            <option value="Presidential Suite">Presidential Suite</option>
          </select>
        </div>

        <button type="submit" class="btn-booking">Check Availability</button>

      </form>
    </div>

    <div class="hero-heading reveal">
      <h1>Grand Cosmopolitan Hotel</h1>
    </div>

  </section>

</main>

<!-- ============ STICKY MOBILE BOOK BAR ============ -->
<div class="mobile-book-bar">
  <a href="#booking">Book Now</a>
</div>

<script src="main.js"></script>

</body>
</html>
